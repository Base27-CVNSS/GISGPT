name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate example
        run: python scripts/validate_vfm.py examples/sample.vfm.json
      - name: Generate SFT sample
        run: python scripts/generate_spatial_tasks.py examples/sample.vfm.json /tmp/vfm_tasks.jsonl
      - name: Test
        run: pytest -q
