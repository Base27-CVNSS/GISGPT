[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisgpt-vfm"
version = "0.1.0"
description = "VFM-native spatial foundation model research scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "GISGPT contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
geo = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0"
]
train = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=3.0",
  "peft>=0.13",
  "accelerate>=1.0"
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
